name: Build mod jar
 
on:
  push:
  workflow_dispatch:
 
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Unpack project
        run: |
          mkdir proj
          unzip -q project.zip -d proj
      - name: Build
        working-directory: proj
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon
      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: verdantvibes-1.21.11-jar
          path: |
            proj/build/libs/*.jar
            !proj/build/libs/*-sources.jar
